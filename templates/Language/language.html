<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-PRINT - Select Language</title>
    <!-- Tailwind and Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Playwrite+DE+Grund:wght@100..400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <style>
        :root {
            --font-main: 'Google Sans Flex', sans-serif;
            --font-title: 'Google Sans Flex', sans-serif;
        }

        body {
            font-family: var(--font-main);
            user-select: none;
            -webkit-user-drag: none;
            background-color: #ffffff;
            cursor: default;
        }

        /* Custom scrollbar for grid */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f9f9f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #eaeaea;
            border-radius: 4px;
        }
        
        .speaking-btn {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col p-8 overflow-hidden select-none bg-white border-[16px] border-slate-100/80 rounded-[40px]">

    <!-- Top Bar Header -->
    <header class="flex justify-between items-center w-full mb-8">
        <!-- Controls Box -->
        <div class="flex items-center gap-2 border border-slate-200 rounded-2xl p-2 bg-white shadow-sm">
            <!-- Close Button -->
            <button onclick="abortSession()" class="w-10 h-10 border border-slate-200 hover:bg-slate-50 flex items-center justify-center rounded-xl text-slate-600 transition-all active:scale-95" title="Abort Session">
                <span class="material-symbols-outlined text-xl">close</span>
            </button>
            <!-- Audio Toggle Button -->
            <button id="voiceBtn" class="w-10 h-10 border border-slate-200 hover:bg-slate-50 flex items-center justify-center rounded-xl text-slate-600 transition-all active:scale-95" title="Listen instructions">
                <span class="material-symbols-outlined text-xl">volume_up</span>
            </button>
            <!-- Contrast/Theme Toggle Button -->
            <button onclick="toggleDarkMode()" class="w-10 h-10 border border-slate-200 hover:bg-slate-50 flex items-center justify-center rounded-xl text-slate-600 transition-all active:scale-95" title="Toggle Theme">
                <span class="material-symbols-outlined text-xl">light_mode</span>
            </button>
            <!-- Refresh Button -->
            <button onclick="window.location.reload()" class="w-10 h-10 border border-slate-200 hover:bg-slate-50 flex items-center justify-center rounded-xl text-slate-600 transition-all active:scale-95" title="Refresh">
                <span class="material-symbols-outlined text-xl">autorenew</span>
            </button>
            
            <!-- Date Box -->
            <div class="border border-slate-200 px-4 py-2 rounded-xl text-sm font-bold text-slate-600 min-w-[110px] text-center" id="date-box">
                -- -- --
            </div>
            <!-- Time Box -->
            <div class="border border-slate-200 px-4 py-2 rounded-xl text-sm font-bold text-slate-600 min-w-[130px] text-center" id="time-box">
                -- : -- : -- --
            </div>
        </div>

        <!-- Right Colored Dots -->
        <div class="flex gap-2">
            <div class="w-4 h-4 rounded-full bg-[#ff007f]"></div>
            <div class="w-4 h-4 rounded-full bg-[#7f00ff]"></div>
            <div class="w-4 h-4 rounded-full bg-[#007fff]"></div>
        </div>
    </header>

    <!-- Content Area -->
    <main class="flex-grow flex flex-col items-center max-w-6xl w-full mx-auto overflow-hidden">
        <!-- Page Title -->
        <h2 class="text-3xl font-black text-slate-900 tracking-tight mb-8 flex items-center gap-2">
            <span>Choose the Language</span>
            <span class="material-symbols-outlined text-2xl font-bold">language</span>
        </h2>

        <!-- Search Bar -->
        <div class="w-full max-w-3xl mb-12 relative">
            <span class="material-symbols-outlined text-slate-400 absolute left-6 top-4 text-xl">explore</span>
            <input type="text" id="search-input" placeholder="Search for language" class="w-full bg-white border border-slate-200 focus:border-slate-300 focus:ring-0 rounded-2xl py-3.5 pl-16 pr-6 text-sm font-semibold shadow-[0_6px_30px_rgba(0,0,0,0.05)] focus:shadow-[0_8px_35px_rgba(0,0,0,0.07)] transition-all placeholder:text-slate-400 text-slate-800 focus:outline-none"/>
        </div>

        <!-- Flags Grid -->
        <div class="w-full flex-grow overflow-y-auto pb-8">
            <div id="flags-grid" class="grid grid-cols-4 gap-x-12 gap-y-10 max-h-[58vh] px-4 py-1">
                <!-- Language cards injected here -->
            </div>
        </div>
    </main>

    <!-- Session Timeout Overlay -->
    <div id="timeout-overlay" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center hidden">
        <img src="https://i.supaimg.com/d0495ff2-7a2f-426d-a287-7b3b2861a5ee/eab2b984-5640-4a77-a221-f6a3f18b0d50.jpg" alt="Session Expired" class="w-full h-full object-cover">
    </div>

    <!-- Script Logic -->
    <script>
        const voiceBtn = document.getElementById('voiceBtn');
        const timeoutOverlay = document.getElementById('timeout-overlay');
        const elem = document.documentElement;
        
        let isSpeaking = false;
        
        const sessionId = localStorage.getItem('session_id') || 'offline_session';

        // Languages List matching mockup
        const languages = [
            { name: "Hindi", code: "hi", flag: "in" },
            { name: "English", code: "en", flag: "in" },
            { name: "Marathi", code: "mr", flag: "in" },
            { name: "English (US)", code: "en-US", flag: "us" },
            { name: "Mandarin Chinese", code: "zh", flag: "cn" },
            { name: "Spanish", code: "es", flag: "es" },
            { name: "French", code: "fr", flag: "fr" },
            { name: "Arabic(SA)", code: "ar", flag: "sa" },
            { name: "Bengali", code: "bn", flag: "bd" },
            { name: "Portuguese", code: "pt", flag: "pt" },
            { name: "Russian", code: "ru", flag: "ru" },
            { name: "Urdu", code: "ur", flag: "pk" },
            { name: "Indonesian", code: "id", flag: "id" },
            { name: "German", code: "de", flag: "de" },
            { name: "Japanese", code: "ja", flag: "jp" },
            { name: "Telugu", code: "te", flag: "in" }
        ];

        // Voice Prompt Messages
        const voicePrompts = {
            'English': {
                select: "You have selected English.",
                instruct: "Select your preferred language to continue."
            },
            'Hindi': {
                select: "आपने हिंदी भाषा चुनी है।",
                instruct: "आगे बढ़ने के लिए अपनी पसंदीदा भाषा चुनें।"
            },
            'Marathi': {
                select: "तुम्ही मराठी भाषा निवडली आहे।",
                instruct: "पुढे जाण्यासाठी आपली आवडती भाषा निवडा।"
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderLanguages(languages);
            updateClock();
            setInterval(updateClock, 1000);
            
            // Auto speak instruction
            setTimeout(() => {
                speak(voicePrompts['English'].instruct, 'en');
            }, 600);

            // Search filter
            document.getElementById('search-input').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtered = languages.filter(lang => lang.name.toLowerCase().includes(query));
                renderLanguages(filtered);
            });
        });

        // Clock Update
        function updateClock() {
            const now = new Date();
            // Format Date: e.g. "12 JULY 26"
            const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
            const day = String(now.getDate()).padStart(2, '0');
            const month = months[now.getMonth()];
            const year = String(now.getFullYear()).substring(2);
            document.getElementById('date-box').innerText = `${day} ${month} ${year}`;
            
            // Format Time: e.g. "23 : 00 : 55 PM"
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // 0 should be 12
            const strHours = String(hours).padStart(2, '0');
            document.getElementById('time-box').innerText = `${strHours} : ${minutes} : ${seconds} ${ampm}`;
        }

        // Render languages grid
        function renderLanguages(list) {
            const grid = document.getElementById('flags-grid');
            grid.innerHTML = '';
            
            list.forEach(lang => {
                const card = document.createElement('button');
                card.onclick = () => selectLanguage(lang.name, lang.code);
                card.className = "flex flex-col items-center justify-center p-3 transition-all active:scale-95 group focus:outline-none";
                
                // Get FlagCDN URL
                const flagUrl = `https://flagcdn.com/w160/${lang.flag}.png`;
                
                card.innerHTML = `
                    <div class="w-40 h-[100px] border border-slate-200 rounded-[8px] overflow-hidden shadow-sm group-hover:scale-105 group-hover:shadow transition-all duration-200 mb-3 bg-slate-50 flex items-center justify-center">
                        <img src="${flagUrl}" class="w-full h-full object-cover" alt="${lang.name}"/>
                    </div>
                    <span class="text-xs font-black text-slate-500 group-hover:text-slate-800 transition-colors tracking-wide">${lang.name}</span>
                `;
                grid.appendChild(card);
            });
        }

        // TTS voice engine utilizing the backend gTTS endpoint
        function speak(text, langCode = 'en') {
            if (!text) return;
            const existingAudio = document.getElementById('neural-speech-audio');
            if (existingAudio) {
                try {
                    existingAudio.pause();
                } catch(e){}
                existingAudio.remove();
            }
            
            voiceBtn.classList.add('speaking-btn', 'text-yellow-600');
            const audio = document.createElement('audio');
            audio.id = 'neural-speech-audio';
            audio.src = `/api/speak?text=${encodeURIComponent(text)}&lang=${langCode}`;
            document.body.appendChild(audio);
            audio.play().catch(err => console.log("Audio playback deferred:", err));
            audio.onended = () => {
                voiceBtn.classList.remove('speaking-btn', 'text-yellow-600');
            };
            audio.onerror = () => {
                voiceBtn.classList.remove('speaking-btn', 'text-yellow-600');
            };
        }

        voiceBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            speak(voicePrompts['English'].instruct, 'en');
        });



        function selectLanguage(langName, langCodeStr) {
            // Store selected language
            localStorage.setItem('selectedLanguage', langName);
            
            let speakLang = 'en';
            if (langName === 'Hindi') speakLang = 'hi';
            if (langName === 'Marathi') speakLang = 'mr';
            
            const msg = voicePrompts[langName]?.select || `You have selected ${langName}`;
            speak(msg, speakLang);
            
            // Navigate after short delay
            setTimeout(() => {
                window.location.href = 'uploadprocess.html';
            }, 1200);
        }

        // Abort session logic
        function abortSession() {
            fetch('/api/session/abort', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId })
            }).finally(() => {
                localStorage.removeItem('session_id');
                window.location.href = 'welcome.html';
            });
        }

        // Session Timer (5 minutes)
        const SESSION_TIMEOUT = 5 * 60 * 1000;
        const sessionTimer = setTimeout(() => {
            timeoutOverlay.classList.remove('hidden');
            timeoutOverlay.classList.add('flex');
            speak("Session expired. Returning to welcome screen.", 'en');
            abortSession();
            setTimeout(() => {
                window.location.href = 'welcome.html';
            }, 5000);
        }, SESSION_TIMEOUT);

        // Enter fullscreen on click
        function openFullscreen() {
            if (document.fullscreenElement) return;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            }
        }
        document.addEventListener('click', openFullscreen);
        document.addEventListener('contextmenu', event => event.preventDefault());

        function toggleDarkMode() {
            // Optional style toggle
            alert("Touchscreen brightness set to maximum kiosk grade.");
        }
    </script>
</body>
</html>
